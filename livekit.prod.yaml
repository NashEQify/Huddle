# LiveKit Server Configuration — production template
# Copy this file and fill in api_key + server IP.
#
# LiveKit runs with network_mode: host (Docker bridge breaks ICE discovery).
# Signaling on port 7890 (default 7880 may be occupied).
# Media (7882-7892/UDP): one port per concurrent participant.
# ICE TCP (7881/TCP): fallback when UDP fails.

port: 7890

rtc:
  port_range_start: 7882
  port_range_end: 7892
  tcp_port: 7881           # ICE TCP fallback
  use_external_ip: false   # true may panic on /32 interface hosts
  # Replace <YOUR_SERVER_IP> with your server's public IP address
  node_ip: <YOUR_SERVER_IP> # explicit public IP for ICE candidates

room:
  empty_timeout: 60  # Ghost call cleanup after 60s

webhook:
  urls:
    # LiveKit on host network reaches app via 127.0.0.1 (NOT localhost —
    # some hosts resolve localhost to 127.0.1.1 which bypasses Docker port binding)
    - http://127.0.0.1:3000/api/livekit/webhook
  api_key: FILL_IN_LIVEKIT_API_KEY
