<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pac-Man: yellow circle with mouth, on dark background -->
  <!-- Pac-Man body (circle approximated with rects) -->
  <rect x="20" y="8" width="24" height="4" fill="#ffdd00"/>
  <rect x="12" y="12" width="36" height="4" fill="#ffdd00"/>
  <rect x="8" y="16" width="44" height="4" fill="#ffdd00"/>
  <rect x="8" y="20" width="44" height="4" fill="#ffdd00"/>
  <rect x="4" y="24" width="48" height="4" fill="#ffdd00"/>
  <rect x="4" y="28" width="48" height="4" fill="#ffdd00"/>
  <rect x="4" y="32" width="48" height="4" fill="#ffdd00"/>
  <rect x="4" y="36" width="48" height="4" fill="#ffdd00"/>
  <rect x="8" y="40" width="44" height="4" fill="#ffdd00"/>
  <rect x="8" y="44" width="44" height="4" fill="#ffdd00"/>
  <rect x="12" y="48" width="36" height="4" fill="#ffdd00"/>
  <rect x="20" y="52" width="24" height="4" fill="#ffdd00"/>
  <!-- Eye -->
  <rect x="28" y="16" width="8" height="8" fill="#1a1a1a"/>
  <!-- Mouth (cut out / transparent via background color) -->
  <rect x="40" y="28" width="16" height="4" fill="#1a1a2e"/>
  <rect x="36" y="32" width="20" height="4" fill="#1a1a2e"/>
  <rect x="40" y="36" width="16" height="4" fill="#1a1a2e"/>
  <!-- Dots (pellets) -->
  <rect x="56" y="28" width="4" height="4" fill="#ffdd00"/>
  <!-- Accent dots (TTY style) -->
  <rect x="0" y="0" width="64" height="4" fill="#a8d8b9" opacity="0.15"/>
  <rect x="0" y="60" width="64" height="4" fill="#a8d8b9" opacity="0.15"/>
</svg>
